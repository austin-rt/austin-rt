name: Profile README

on:
  push:
    branches: [main]
    paths:
      - "src/data/**"
      - "src/assets/**"
      - "src/readme/**"
      - "src/utils/constants.js"
      - "scripts/readme/**"
      - ".github/workflows/readme.yml"
  # Open Source PR statuses change without a push.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run readme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Profile README: regenerate from site data" README.md
          git push
